[project]
name = "tmt-workspace"
version = "0.1.0"
description = "TMT Workspace enterprise platform foundation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13,<2",
  "asyncpg>=0.29,<1",
  "fastapi>=0.115,<1",
  "pwdlib[argon2]>=0.2,<1",
  "pydantic[email]>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "pyjwt>=2.9,<3",
  "redis>=5.0,<6",
  "sqlalchemy[asyncio]>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = [
  "asgi-lifespan>=2.1,<3",
  "httpx>=0.27,<1",
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.23,<1",
  "pytest-cov>=5.0,<6",
  "ruff>=0.6,<1",
  "types-redis>=4.6,<5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = [
  "A",
  "ASYNC",
  "B",
  "C4",
  "E",
  "F",
  "I",
  "N",
  "PT",
  "RUF",
  "S",
  "SIM",
  "T20",
  "UP",
]
ignore = [
  "S101",
  # 语言规则（AGENTS.md）：注释与文档字符串使用中文，全角标点是正常书写，
  # 不再视为“歧义 Unicode”。RUF001 作用于字符串、RUF002 作用于文档字符串、RUF003 作用于注释。
  "RUF001",
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S603"]
# OAuth vocabulary ("token_type: bearer", access-token fields) is not secret material.
"app/modules/auth/schemas.py" = ["S105"]
"app/modules/auth/api.py" = ["S106"]
"app/modules/auth/service.py" = ["S105"]
"app/cli.py" = ["T201"]  # CLI 输出本身就是产品接口，不是调试打印。

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
show_error_codes = true
packages = ["app"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["uvicorn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
markers = [
  "postgres: integration tests that require an isolated PostgreSQL 16 test database",
]

[tool.coverage.run]
source = ["app"]
branch = true
