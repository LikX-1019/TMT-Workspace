services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tmt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tmt_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-tmt_workspace}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    environment:
      TMT_ENVIRONMENT: development
      TMT_DEBUG: ${TMT_DEBUG:-false}
      TMT_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-tmt}:${POSTGRES_PASSWORD:-tmt_change_me}@postgres:5432/${POSTGRES_DB:-tmt_workspace}
      TMT_REDIS_URL: redis://redis:6379/0
      TMT_SECRET_KEY: ${TMT_SECRET_KEY:?Set TMT_SECRET_KEY}
      TMT_CORS_ORIGINS: '["http://localhost:5173","http://localhost:8080"]'
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
